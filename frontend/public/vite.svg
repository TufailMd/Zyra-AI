<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Soft glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger core glow -->
    <filter id="coreGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Core gradient -->
    <radialGradient id="core" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e0fbff"/>
      <stop offset="30%" stop-color="#70e8ff"/>
      <stop offset="65%" stop-color="#00b8e0"/>
      <stop offset="100%" stop-color="#006a90"/>
    </radialGradient>

    <!-- Ring gradient -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80f0ff"/>
      <stop offset="100%" stop-color="#0088b0"/>
    </linearGradient>
  </defs>

  <!-- Transparent / black background (favicon friendly) -->
  <rect width="100" height="100" fill="#000000"/>

  <!-- Atmospheric soft glow -->
  <circle cx="50" cy="50" r="42" fill="#00c8f0" opacity="0.08" filter="url(#glow)"/>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#ring)" stroke-width="1.4" opacity="0.55" filter="url(#glow)"/>

  <!-- Tick marks -->
  <g stroke="#60e0ff" stroke-width="1.1" opacity="0.6">
    <line x1="50" y1="12" x2="50" y2="16"/>
    <line x1="50" y1="84" x2="50" y2="88"/>
    <line x1="12" y1="50" x2="16" y2="50"/>
    <line x1="84" y1="50" x2="88" y2="50"/>
  </g>

  <!-- Mid ring -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#40d0f0" stroke-width="1.2" opacity="0.7"/>

  <!-- Inner ring -->
  <circle cx="50" cy="50" r="23" fill="none" stroke="#80e8ff" stroke-width="1" opacity="0.5"/>

  <!-- Sound wave hints (simplified for small size) -->
  <g fill="none" stroke="#00d8ff" stroke-linecap="round" opacity="0.65">
    <path d="M 14 42 Q 8 50, 14 58" stroke-width="1.3"/>
    <path d="M 10 45 Q 3 50, 10 55" stroke-width="1.0"/>
    <path d="M 86 42 Q 92 50, 86 58" stroke-width="1.3"/>
    <path d="M 90 45 Q 97 50, 90 55" stroke-width="1.0"/>
  </g>

  <!-- Core sphere -->
  <circle cx="50" cy="50" r="17" fill="url(#core)" filter="url(#coreGlow)"/>

  <!-- Inner highlight ring -->
  <circle cx="50" cy="50" r="10" fill="none" stroke="#c0f8ff" stroke-width="1.1" opacity="0.6"/>

  <!-- Center energy point -->
  <circle cx="50" cy="50" r="3.5" fill="#ffffff" filter="url(#coreGlow)"/>
</svg>
